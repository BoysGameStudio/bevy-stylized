name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned Rust toolchain
        id: rust
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          with open("rust-toolchain.toml", "rb") as source:
              channel = tomllib.load(source)["toolchain"]["channel"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"toolchain={channel}\n")
          PYTHON
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: python3 tools/dev.py check --lane cpu --required
      - name: Inspector build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev
      - run: python3 tools/dev.py check --lane inspector-cpu --required
      - run: python3 tools/dev.py check --lane consumers --fetch --required
  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        args:
          - -p bevy-stylized-core --no-default-features
          - -p bevy-stylized-core --features schema
          - -p bevy-stylized --no-default-features
          - -p bevy-stylized --no-default-features --features gltf
          - -p bevy-stylized --no-default-features --features render
          - -p bevy-stylized --features profile-genshin
          - -p bevy-stylized-gltf --no-default-features
          - -p bevy-stylized-gltf
          - -p bevy-stylized-tools --no-default-features
          - -p bevy-stylized-tools --features profile-genshin,schema
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned Rust toolchain
        id: rust
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          with open("rust-toolchain.toml", "rb") as source:
              channel = tomllib.load(source)["toolchain"]["channel"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"toolchain={channel}\n")
          PYTHON
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked ${{ matrix.args }}
