[package]
name = "stylized-integration-tests"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
bevy = { workspace = true, features = ["bevy_animation", "bevy_gltf", "bevy_scene", "png", "reflect_auto_register"] }
bevy-stylized = { path = "../../crates/bevy-stylized" }
bevy-stylized-gltf = { path = "../../crates/bevy-stylized-gltf" }
golden-harness = { path = "../harness" }
scenes = { path = "../../labs/scenes", features = ["build"] }
showcase = { path = "../../apps/showcase" }
scene-runtime = { path = "../../labs/scene-runtime" }
scenario-model = { path = "../../labs/scenario-model" }
serde_json.workspace = true
sha2.workspace = true
serde.workspace = true
tempfile.workspace = true
gltf.workspace = true
bevy-stylized-render = { path = "../../crates/bevy-stylized-render" }
bevy-stylized-core = { path = "../../crates/bevy-stylized-core" }
naga = { version = "=29.0.4", features = ["wgsl-in"] }

[lints]
workspace = true

[features]
# ADR-0023 证据通道：转发 bevy-stylized 的 opt-in 投影能力。默认关闭，
# 默认 lane/必需套件行为不变（`shadow_casting` 测试在两种构建下分别
# 钉死开启/关闭语义）。
shadow-casting = ["bevy-stylized/shadow-casting"]
