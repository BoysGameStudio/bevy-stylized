[workspace]
resolver = "3"
members = [
    "crates/bevy-stylized",
    "crates/bevy-stylized-core",
    "crates/bevy-stylized-gltf",
    "crates/bevy-stylized-profile-genshin",
    "crates/bevy-stylized-tools",
    "crates/bevy-stylized-render",
    "crates/dev/benchmarks",
    "crates/dev/golden-harness",
    "crates/dev/gpu-driven-spike",
    "crates/dev/regression-lab",
    "crates/dev/odette-reference-lab",
    "crates/dev/reference-comparison",
    "crates/dev/showcase",
    "crates/legacy/bevy-cel",
    "crates/legacy/bevy-cel-metadata",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# License intentionally unset at the workspace level: pending ADR-0017 /
# provenance review. Legacy crates carry their original license fields.

[workspace.lints.clippy]
# Bevy-inherent: ECS queries are complex types and systems take many
# params by design (same allowances as bevy itself / the Flock template).
type_complexity = "allow"
too_many_arguments = "allow"
# Legacy reference crates are frozen verbatim copies; their test-module
# layout is kept as imported.
items_after_test_module = "allow"

[workspace.dependencies]
# Bevy baseline is pinned to the architecture baseline (ARCHITECTURE.md).
bevy = { version = "=0.19.1", default-features = false }
# Sub-crate pins mirror the Bevy baseline; bevy-stylized-core may only depend
# on these three (plus serde), per docs/architecture/03.
bevy_math = { version = "=0.19.1", default-features = false }
bevy_color = { version = "=0.19.1", default-features = false }
bevy_reflect = { version = "=0.19.1", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
tempfile = "3"
gltf = { version = "=1.4.1", features = ["extensions"] }
# Asset Compiler（bevy-stylized-tools compile）：ILM 打包需要 PNG 解码/编码
# （gltf crate 不解码图片；仅启用 png feature，保持 CLI 依赖面最小）。
image = { version = "0.25", default-features = false, features = ["png"] }
# compile --json 报告要求产物内容哈希；与 fixtures 既有 sha256 provenance
# 约定一致（见 fixtures/reference/export-sidecar.json）。
sha2 = "0.10"
