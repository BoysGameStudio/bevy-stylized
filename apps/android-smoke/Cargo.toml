[package]
name = "stylized-android-smoke"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "stylized_android_smoke"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = ["std", "async_executor", "multi_threaded", "bevy_winit", "bevy_pbr", "android-game-activity"] }
bevy-stylized = { path = "../../crates/bevy-stylized", default-features = false, features = ["render"] }
scene-runtime = { path = "../../labs/scene-runtime" }
scenes = { path = "../../labs/scenes", features = ["build"] }
scenario-model = { path = "../../labs/scenario-model" }
golden-harness = { path = "../../tests/harness" }
showcase = { path = "../showcase" }
serde_json = { workspace = true }

[features]
character = ["bevy-stylized/gltf", "bevy/bevy_gltf", "bevy/bevy_scene", "bevy/png", "bevy/reflect_auto_register"]

[lints]
workspace = true
