[package]
name = "regression-lab"
version = "0.1.0"
edition.workspace = true
publish = false
description = "V2-g sweep runner: Count x Resolution x Tier x Lighting x Pose regression matrix with golden subset and baseline gate (ADR-0029 evidence)."

[dependencies]
bevy = { workspace = true, features = [
    "bevy_animation",
    "bevy_gltf",
    "bevy_scene",
    "png",
    "reflect_auto_register",
] }
bevy-stylized = { path = "../../crates/bevy-stylized" }
scenes = { path = "../scenes", features = ["build"] }
scene-runtime = { path = "../scene-runtime" }
scenario-model = { path = "../scenario-model" }
golden-harness = { path = "../../tests/harness" }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
