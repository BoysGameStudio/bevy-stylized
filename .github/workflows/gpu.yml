name: GPU qualification
# Explicit trusted-code execution; runner provisioning is a separate platform task.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stylized-gpu-qualification
  cancel-in-progress: false
jobs:
  gpu:
    runs-on: [self-hosted, linux, stylized-gpu]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Read pinned Rust toolchain
        id: rust
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          with open("rust-toolchain.toml", "rb") as source:
              channel = tomllib.load(source)["toolchain"]["channel"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"toolchain={channel}\n")
          PYTHON
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
      - run: python3 tools/dev.py check --lane gpu --required
