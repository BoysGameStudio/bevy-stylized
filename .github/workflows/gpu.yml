name: GPU qualification
# Explicit trusted-code execution; runner provisioning is a separate platform task.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stylized-gpu-qualification
  cancel-in-progress: false
jobs:
  gpu:
    runs-on: [self-hosted, linux, stylized-gpu]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: dtolnay/rust-toolchain@master
      - run: python3 tools/dev.py check --lane gpu --required
