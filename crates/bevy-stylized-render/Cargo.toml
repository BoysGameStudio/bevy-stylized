[package]
name = "bevy-stylized-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../../README.md"
publish = false
description = "Cel@Portable render slice for bevy-stylized: thin Material backend, hull outline, view sync (provisional pending ADR-0001)."

[dependencies]
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_log",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_window",
] }
bevy-stylized-core = { version = "0.1.0", path = "../bevy-stylized-core" }

[dev-dependencies]
bevy = { workspace = true, features = ["bevy_animation", "bevy_gltf", "bevy_scene", "png", "reflect_auto_register"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# Matches the naga revision used by bevy_shader 0.19 for composed-module validation.
naga = { version = "=29.0.4", features = ["wgsl-in"] }

[lints]
workspace = true

[features]
# Opt-in: stylized surfaces cast into shadow maps (Tenacity's game scene keeps
# shadow-mapped ground contact readable). Receiving is unchanged: the stylized
# shaders never sample shadow maps, so the authored ramp shading is unaffected.
shadow-casting = []
