[package]
name = "showcase"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Showcase suite for bevy-stylized (12 fixed cases; interactive window or headless capture)."

[[bin]]
name = "showcase"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = [
    "bevy_animation",
    "bevy_gltf",
    "bevy_scene",
    "png",
    "reflect_auto_register",
] }
bevy-stylized = { path = "../../bevy-stylized" }
benchmarks = { path = "../benchmarks" }
golden-harness = { path = "../golden-harness" }

[features]
# 开窗交互模式需要 winit（x11）。默认关闭：headless 捕获与测试不含
# winit，避免事件循环进入测试线程的兼容性问题。
interactive = ["bevy/bevy_winit", "bevy/x11"]

[lints]
workspace = true
