[package]
name = "bevy_gltf_metadata"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish = false
description = "Reusable glTF metadata integration for Bevy"
keywords = ["bevy", "gltf", "metadata", "gamedev"]
categories = ["game-development", "encoding"]

[[bin]]
name = "cel_gltf_validate"
path = "src/bin/cel_gltf_validate.rs"
required-features = ["gltf", "reflect"]

[dependencies]
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_gltf",
    "bevy_mesh",
    "bevy_render",
] }
gltf.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true

[features]
default = ["gltf", "reflect"]
gltf = ["reflect"]
reflect = []

[dev-dependencies]
bevy = { workspace = true, features = ["bevy_animation", "bevy_pbr", "bevy_scene"] }
tempfile.workspace = true

[lints]
workspace = true
