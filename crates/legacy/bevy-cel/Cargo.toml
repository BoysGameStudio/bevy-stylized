[package]
name = "bevy_cel"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish = false
description = "Reusable cel-shading and NPR rendering foundations for Bevy"
keywords = ["bevy", "rendering", "cel-shading", "npr"]
categories = ["game-development", "graphics"]

[dependencies]
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_gltf",
    "bevy_image",
    "bevy_log",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_render",
    "bevy_scene",
    "bevy_window",
] }
bevy_gltf_metadata = { path = "../bevy-cel-metadata", default-features = false, features = ["gltf"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
bevy = { workspace = true, features = ["bevy_animation"] }
# Matches the naga revision used by bevy_shader 0.19 for composed-module validation.
naga = { version = "=29.0.4", features = ["wgsl-in"] }
